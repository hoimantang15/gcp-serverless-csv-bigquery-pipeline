name: Deploy CSV Pipeline Function

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy 2nd Gen Cloud Run function
        run: |
          gcloud functions deploy process-csv-file \
            --gen2 \
            --region=us-central1 \
            --runtime=python312 \
            --source=. \
            --entry-point=process_csv \
            --service-account=${{ vars.GCP_SA_EMAIL }} \
            --set-env-vars=QUARANTINE_BUCKET=${{ vars.QUARANTINE_BUCKET }} \
            --trigger-event-filters=type=google.cloud.storage.object.v1.finalized \
            --trigger-event-filters=bucket=${{ vars.RAW_BUCKET }} \
            --project=ace-csv-pipeline-project01